[build-system]

# Poetry.
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool]

[tool.doc8]

ignore-path = [
  ".tox",
  ".venv",
  "*.egg-info",
]

[tool.pccc]

header_length = 50
body_length = 72
wrap = true
force_wrap = true
spell_check = false
repair = false
ignore_generated_commits = false

types = [
  "depends",
  "doc",
  "feat",
  "fix",
  "perf",
  "refactor",
  "release",
  "style",
  "test",
]

scopes = [
  "bin",
  "vocutil",
  "tooling",
]

footers = [
  "github-closes",
  "signed-off-by",
]

required_footers = [
  "signed-off-by",
]

[tool.poetry]

authors = [
  "Jeremy A Gray <gray@flyquackswim.com>",
]
description = "educational vocabulary utilities"
name = "vocutil"
version = "0.0.5"
license = "GPL-3.0-or-later"
maintainers = [
  "Jeremy A Gray <gray@flyquackswim.com>",
]
readme = "README.rst"
homepage = "https://github.com/jeremyagray/vocutil"
repository = "https://github.com/jeremyagray/vocutil"

classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Education",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

packages = [
  { include = "vocutil" },
]

[tool.poetry.dependencies]

Jinja2 = ">=3"
defusedxml = ">=0"
python = ">=3.12.1,<4.0"

[tool.poetry.group.dev.dependencies]

doc8 = ">=2"
hypothesis = ">=6"
pccc = ">=0"
pre-commit = ">=4"
pytest = ">=8"
pytest-cov = ">=6"
ruff = ">=0"
sphinx = ">=8"
tox = ">=4"

[tool.poetry.scripts]

create-unit = "vocutil:create_unit"
enrich = "vocutil:enrich"
gjson2csv = "vocutil:export_csv"

[tool.poetry.urls]

"Issues" = "https://github.com/jeremyagray/vocutil/issues"
"Documentation" = "https://vocutil.readthedocs.io/"
"Repository" = "https://github.com/jeremyagray/vocutil"

[tool.pytest.ini_options]

pythonpath = [
  ".",
]

[tool.ruff.lint]

select = [
  "B",
  "C90",
  "D",
  "E",
  "F",
  "RUF",
  "S",
  "W",
]

ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]

"__init__.py" = [
  "F401",
]

"tests/**/*.py" = [
    "S101",
    "S311",
]

"**/test_*.py" = [
    "S101",
    "S311",
]
