[tox]

envlist =
  clean-coverage
  py{311,312,313}
  lint
  report

isolated_build = True
skip_missing_interpreters = True
requires =
    pip>=20.0

[testenv]

description = Test supported environments.
deps =
  defusedxml
  pyfakefs
  pytest
commands =
  pytest --doctest-modules --doctest-glob='*.rst' -vvvv

[testenv:py313]

description = Generate test coverage data.
deps =
  defusedxml
  pyfakefs
  pytest
  pytest-cov
commands =
  pytest --doctest-modules --doctest-glob='*.rst' -vvvv --cov vocutil --cov-report term --cov-report html

[testenv:build]

description = Build packages.
deps =
  build
skip_install = true
commands =
  python3 -m build

[testenv:build-docs]

description = Generate documentation.
deps =
  Sphinx>=8
commands =
  sphinx-build -M clean docs docs/_build/html
  sphinx-build -b html -nW --keep-going -d docs/_build/.doctrees docs docs/_build/html
  sphinx-build -b html -nW --keep-going -d docs/_build/.doctrees docs docs/_build/html

[testenv:clean-coverage]

description = Erase previous test coverage data.
deps =
  coverage[TOML]
skip_install = true
commands =
  coverage erase

[testenv:lint-bandit]

description = Run bandit checks.
skip_install = True
deps =
  bandit[toml]
commands =
  bandit --config pyproject.toml --recursive vocutil
labels = lint

[testenv:lint-black]

description = Format python code with black.
skip_install = True
deps =
  black
commands =
    black --check --diff vocutil tests
labels = lint

[testenv:lint-black-fix]

description = Format python code with black.
skip_install = True
deps =
  black
commands =
    black vocutil tests
labels = lint-fix

[testenv:lint-doc8]

description = Run doc8 checks.
skip_install = True
deps =
  doc8
commands =
  doc8
labels = lint

[testenv:lint-flake8]

description = Run flake8 checks.
skip_install = True
deps =
  flake8
  flake8-docstrings
commands =
    flake8 vocutil tests
labels = lint

[testenv:lint-isort]

description = Format module imports.
skip_install = True
deps =
  isort
commands =
    isort --check --df vocutil tests
labels = lint

[testenv:lint-isort-fix]

description = Format module imports.
skip_install = True
deps =
  isort
commands =
    isort --df vocutil tests
labels = lint-fix

[testenv:lint-pydocstyle]

description = Run pydocstyle checks.
skip_install = True
deps =
  pydocstyle
commands =
  pydocstyle
labels = lint

[testenv:lint-yesqa]

description = Find obsolete "# noqa" directives.
skip_install = True
deps =
  yesqa
commands =
  yesqa vocutil/export.py vocutil/test_load.py vocutil/__init__.py vocutil/cc/__init__.py vocutil/cc/item.py vocutil/cc/test_item.py vocutil/cc/test_mr.py vocutil/cc/manifest.py vocutil/cc/test_mc.py vocutil/cc/resources.py vocutil/cc/test_fib.py vocutil/cc/test_tf.py vocutil/cc/mc.py vocutil/cc/tf.py vocutil/cc/test_manifest.py vocutil/cc/bank.py vocutil/cc/cartridge.py vocutil/cc/test_assessment.py vocutil/cc/fib.py vocutil/cc/test_bank.py vocutil/cc/utils.py vocutil/cc/mr.py vocutil/cc/assessment.py vocutil/dump.py vocutil/enrich.py vocutil/words.py vocutil/test_words.py vocutil/load.py vocutil/exceptions.py vocutil/create.py
labels = lint, lint-fix

[testenv:report]

description = Generate current test coverage report.
deps = coverage[TOML]
skip_install = true
commands =
  coverage report
  coverage html

[testenv:upload]

description = Upload packages to PyPI.
deps = twine
skip_install = true
commands =
  python3 -m twine upload --verbose dist/*

[testenv:upload-test]

description = Test upload of packages to PyPI.
deps = twine
skip_install = true
commands =
  python3 -m twine upload --verbose --repository testpypi dist/*
