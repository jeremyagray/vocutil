[tox]

envlist =
  clean-coverage
  py{312,313,314}
  report
  lint-doc8
  lint-ruff-check
  lint-ruff-format

isolated_build = True
skip_missing_interpreters = True
requires =
    pip>=20.0

[testenv]

description = Test supported environments.
deps =
  pytest
commands =
  pytest --doctest-modules --doctest-glob='*.rst' -vvvv
labels =
  test

[testenv:py314]

description = Generate test coverage data.
deps =
  pytest
  pytest-cov
commands =
  pytest --doctest-modules --doctest-glob='*.rst' -vvvv --cov vocutil --cov-report term --cov-report html
labels =
  test

[testenv:report]

description = Generate current test coverage report.
deps =
  coverage[TOML]
skip_install = true
commands =
  coverage report
  coverage html
labels =
  test

[testenv:build]

description = Build packages.
deps =
  build
skip_install = true
commands =
  python3 -m build
labels =
  build

[testenv:build-docs]

description = Generate documentation.
deps =
  sphinx
commands =
  sphinx-build -M clean docs docs/_build/html
  sphinx-build -b html -nW --keep-going -d docs/_build/.doctrees docs docs/_build/html
  sphinx-build -b html -nW --keep-going -d docs/_build/.doctrees docs docs/_build/html
labels =
  build

[testenv:clean-build]

description = Clean after builds.
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf build
  rm -rf dist
  rm -rf *.egg-info
labels =
  clean

[testenv:clean-coverage]

description = Erase previous test coverage data.
deps =
  coverage[TOML]
skip_install = true
commands =
  coverage erase
labels =
  clean

[testenv:clean-docs]

description = Clean after documentation builds.
deps =
  sphinx
commands =
  sphinx-build -M clean docs docs/_build/html
labels =
  clean

[testenv:lint-doc8]

description = Run doc8 checks.
skip_install = True
deps =
  doc8
commands =
  doc8
labels =
  lint

[testenv:lint-ruff-check]

description = Run ruff linting checks.
skip_install = True
deps =
  ruff
commands =
  ruff check
labels =
  lint

[testenv:lint-ruff-check-fix]

description = Run ruff linting checks and fixes.
skip_install = True
deps =
  ruff
commands =
  ruff check --fix
labels =
  lint-fix

[testenv:lint-ruff-format]

description = Check code format with ruff.
skip_install = True
deps =
  ruff
commands =
  ruff format --check
labels =
  lint

[testenv:lint-ruff-format-fix]

description = Reformat code with ruff.
skip_install = True
deps =
  ruff
commands =
  ruff format
labels =
  lint-fix

[testenv:upload]

description = Upload packages to PyPI.
skip_install = true
deps =
  twine
commands =
  python3 -m twine upload --verbose dist/*

[testenv:upload-test]

description = Test upload of packages to PyPI.
skip_install = true
deps =
  twine
commands =
  python3 -m twine upload --verbose --repository testpypi dist/*
